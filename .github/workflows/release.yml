name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check tag format
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc(\.[0-9]+)?$ ]]; then
            prerelease=true
          else
            echo "Unsupported release tag: $tag" >&2
            echo "Use vX.Y.Z for releases or vX.Y.Z-rc / vX.Y.Z-rc.J for prereleases." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "title=Psycho Engine Fixes $tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-mingw-w64-i686 g++-mingw-w64-i686 libclang-dev unzip zip

      - name: Install Rust target
        run: rustup target add i686-pc-windows-gnu

      - name: Build release archives
        run: bash ./.github/scripts/package_release.sh "${{ steps.tag.outputs.tag }}"

      - name: Verify archives
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          core_archive=".release/psycho-engine-fixes-$TAG.zip"
          helper_archive=".release/psycho-engine-fixes-nvse-helper-$TAG.zip"
          omv_archive=".release/omv-nvse-$TAG.zip"
          atom_archive=".release/atom-nvse-$TAG.zip"
          test -f "$core_archive"
          test -f "$helper_archive"
          test -f "$omv_archive"
          test -f "$atom_archive"

          diff -u \
            <(printf '%s\n' \
              "dinput8.dll" \
              "syringe/psycho_engine_fixes.dll" \
              "syringe/psycho_engine_fixes.toml" | sort) \
            <(zipinfo -1 "$core_archive" | grep -v '/$' | sort)

          diff -u \
            <(printf '%s\n' \
              "Data/NVSE/plugins/psycho_engine_fixes_helper.dll" | sort) \
            <(zipinfo -1 "$helper_archive" | grep -v '/$' | sort)

          diff -u \
            <(printf '%s\n' \
              "Data/NVSE/plugins/omv.dll" \
              "Data/NVSE/plugins/omv/omv.default.toml" \
              "Data/NVSE/plugins/omv/shaders/01_depth_aware_cas.hlsl" \
              "Data/NVSE/plugins/omv/shaders/01_depth_aware_cas.toml" \
              "Data/NVSE/plugins/omv/luts/00_neutral.cube" \
              "Data/NVSE/plugins/omv/luts/01_mojave_natural.cube" \
              "Data/NVSE/plugins/omv/luts/02_dusty_western.cube" \
              "Data/NVSE/plugins/omv/luts/03_bleached_wasteland.cube" \
              "Data/NVSE/plugins/omv/luts/04_neon_nights.cube" \
              "Data/NVSE/plugins/omv/luts/05_high_desert_clarity.cube" \
              "Data/NVSE/plugins/omv/luts/06_atomic_amber.cube" \
              "Data/NVSE/plugins/omv/luts/07_frontier_cinema.cube" \
              "Data/NVSE/plugins/omv/luts/08_old_world_film.cube" \
              "Data/NVSE/plugins/omv/luts/09_vault_fluorescent.cube" \
              "Data/NVSE/plugins/omv/luts/10_sierra_sunset.cube" \
              "Data/NVSE/plugins/omv/luts/11_zion_canyon.cube" \
              "Data/NVSE/plugins/omv/luts/12_divide_duststorm.cube" \
              "Data/NVSE/plugins/omv/luts/13_wasteland_noir.cube" \
              "Data/NVSE/plugins/omv/luts/14_midnight_mojave.cube" \
              "Data/NVSE/plugins/omv/luts/15_desert_noir.cube" \
              "Data/NVSE/plugins/omv/luts/16_vegas_after_dark.cube" \
              "Data/NVSE/plugins/omv/luts/17_rain_on_freeside.cube" \
              "Data/NVSE/plugins/omv/luts/18_sierra_madre_gilded.cube" \
              "Data/NVSE/plugins/omv/luts/19_dead_money_poison.cube" \
              "Data/NVSE/plugins/omv/luts/20_mojave_blue_hour.cube" \
              "Data/NVSE/plugins/omv/luts/21_caravan_lantern.cube" \
              "Data/NVSE/plugins/omv/luts/22_dust_and_blood.cube" \
              "Data/NVSE/plugins/omv/luts/23_atomic_monochrome.cube" \
              "Data/NVSE/plugins/omv/luts/24_vault_noir.cube" \
              "Data/NVSE/plugins/omv/luts/25_lonesome_road_ash.cube" \
              "Data/NVSE/plugins/omv/luts/26_radioactive_dream.cube" \
              "Data/NVSE/plugins/omv/luts/27_old_world_detective.cube" \
              "Data/NVSE/plugins/omv/luts/28_capital_wasteland_overcast.cube" \
              "Data/NVSE/plugins/omv/luts/29_potomac_fog.cube" \
              "Data/NVSE/plugins/omv/luts/30_ruined_capitol_dusk.cube" \
              "Data/NVSE/plugins/omv/luts/31_dc_radstorm.cube" \
              "Data/NVSE/plugins/omv/luts/32_underworld_embers.cube" \
              "Data/NVSE/plugins/omv/luts/33_subterranean_survival.cube" \
              "Data/NVSE/plugins/omv/luts/34_emergency_red.cube" \
              "Data/NVSE/plugins/omv/luts/35_frozen_platform.cube" \
              "Data/NVSE/plugins/omv/luts/36_dry_sea_white_sun.cube" \
              "Data/NVSE/plugins/omv/luts/37_dead_city_blue.cube" \
              "Data/NVSE/plugins/omv/luts/38_exclusion_overcast.cube" \
              "Data/NVSE/plugins/omv/luts/39_emission_warning.cube" \
              "Data/NVSE/plugins/omv/luts/40_rusted_laboratory.cube" \
              "Data/NVSE/plugins/omv/luts/41_pripyat_memory.cube" | sort) \
            <(zipinfo -1 "$omv_archive" | grep -v '/$' | sort)

          diff -u \
            <(printf '%s\n' \
              "Data/MCM/Atom.json" \
              "Data/NVSE/plugins/atom.dll" | sort) \
            <(zipinfo -1 "$atom_archive" | grep -v '/$' | sort)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TITLE: ${{ steps.tag.outputs.title }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail

          assets=(
            ".release/psycho-engine-fixes-$TAG.zip"
            ".release/psycho-engine-fixes-nvse-helper-$TAG.zip"
            ".release/omv-nvse-$TAG.zip"
            ".release/atom-nvse-$TAG.zip"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            existing_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            legacy_assets=(
              "psycho-engine-fixes-$TAG-aio.zip"
              "psycho-engine-fixes-helper-$TAG.zip"
              "syringe-$TAG.zip"
              "psycho-engine-fixes-config-$TAG.zip"
            )

            for asset in "${legacy_assets[@]}"; do
              if grep -Fxq "$asset" <<< "$existing_assets"; then
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done

            gh release upload "$TAG" "${assets[@]}" --clobber
            exit 0
          fi

          create_args=(
            release create "$TAG"
            "${assets[@]}"
            --title "$TITLE"
            --generate-notes
            --verify-tag
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            create_args+=(--prerelease)
          fi

          gh "${create_args[@]}"
