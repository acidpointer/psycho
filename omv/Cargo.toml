[package]
name = "omv"
version = "0.1.0"
edition = "2024"

[lib]
name = "omv"
crate-type = ["cdylib", "rlib"]

[features]
# Sampled render-path timing is intentionally absent from normal builds.  The
# feature is for controlled attribution builds and still requires explicit
# runtime arming before it reads the performance counter in a callback.
graphics-diagnostics = []

[dependencies]
anyhow = { workspace = true }
libpsycho = { path = "../libpsycho" }
libnvse = { path = "../libnvse" }
log = { workspace = true }
parking_lot = { workspace = true }
psycho-imgui = { path = "../psycho-imgui" }
rand = { workspace = true }
semver = "1.0"
serde = { workspace = true }
toml = { workspace = true }
toml_edit = "0.22"
