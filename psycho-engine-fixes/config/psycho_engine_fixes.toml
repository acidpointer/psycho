# =============================================================================
# PSYCHO ENGINE FIXES - USER CONFIGURATION
# =============================================================================
#
# Most players should leave everything as shipped.
#
# - true = on, false = off.
# - Change one setting at a time when testing a conflict.
# - Save the file and fully restart the game after any change.
# - With the companion plugin, press F10 to edit these settings in game.
#
# Support: include psycho-engine-fixes-latest.log in bug reports.
# If Crash Logger is installed, include CrashLogger.log too.

# =============================================================================
# MEMORY
# =============================================================================
[memory]

# Allocator mode:
#   2 = Full gheap + scrap heap. Best performance. Recommended.
#   1 = Scrap heap only. Safer fallback; leaves the main object heap vanilla.
#   0 = Vanilla allocators. Diagnostic only; disables both replacements.
#
# The game is 32-bit. Mode 2 reserves memory carefully to reduce address-space
# fragmentation. If mode 2 seems involved in a crash, test mode 1, then mode 0.
allocator = 2

# Experimental: force the game's cleanup queue to fully drain every 10 seconds
# in mode 2. Can cause hitches. Leave off for normal play.
gheap_periodic_pdd_purge = false

# =============================================================================
# ENGINE FIXES
# =============================================================================
[engine_fixes]

# These fixes prevent known crashes and broken behavior. Leave them on unless
# support asks you to test one as a possible mod conflict. Normal valid game
# behavior is preserved; a guard only rejects bad data.

# --- Installation paths -----------------------------------------------------

# Repair Bethesda's 32-bit "Installed Path" registry values at startup.
# Leave on for Windows, Wine, and Proton.
install_path_registry_repair = true

# Optional Fallout 3 folder for TTW and tools that use Bethesda's Fallout 3
# registry key. Empty = repair FalloutNV only. Relative paths are resolved from
# the folder containing FalloutNV.exe. Examples:
#   fallout3_install_path = '..\Fallout 3'
#   fallout3_install_path = 'Z:\Games\Fallout 3'
fallout3_install_path = ''

# --- Display and input ------------------------------------------------------

# Fix broken fullscreen size, placement, and Alt-Tab behavior at startup,
# renderer reset, and focus changes. Leave on unless another window mod conflicts.
display_alt_tab = true

# When FalloutPrefs.ini has bFull Screen=0, use a borderless window at the
# configured size. bFull Screen=1 always stays native fullscreen.
display_borderless_windowed = true

# Keep the mouse inside the game window while it is active. Framed windows keep
# their title bar and resize border usable. The cursor is released when the game
# loses focus.
window_cursor_lock = true

# Let Windows receive the Super/Windows key, PrintScreen, and media keys while
# the game is active. Normal game keyboard input still works.
input_system_key_passthrough = true

# --- Saves and load safety --------------------------------------------------

# Write saves durably and reject corrupt load records. A failed save does not
# replace your previous save. Leave on.
save_integrity_fix = true

# Treat a tiny invalid pathfinding pointer as "no path" instead of crashing.
navmesh_low_pointer_guard = true

# Drop broken inventory entries during save/load. Other items are untouched.
entrydata_invalid_form_guard = true

# Detach a corrupt inventory list from a generated NPC or creature while it is
# being destroyed. Valid lists are untouched; a corrupt list may leak.
actor_container_retirement_guard = true

# Prevent a crash when a broken animation is cleaned up. Valid animations are
# unchanged.
animation_sequence_idtag_retirement_guard = true

# Treat an invalid item owner as "no owner" instead of following a bad pointer.
extraownership_invalid_owner_guard = true

# Remove an invalid encounter-zone link, then fall back to a valid cell or
# worldspace zone.
encounter_zone_invalid_form_guard = true

# Ignore a stale patrol owner ID that now belongs to a different kind of form.
patrol_owner_form_id_guard = true

# Remove a dead reference from its cell render list before it is used. Live
# references are untouched.
cell_render_reference_retirement_fix = true

# Ignore a stale linked-reference child list during a save transition.
linked_ref_children_stale_list_guard = true

# Skip a linked reference whose target has a broken base form.
linked_ref_target_base_form_guard = true

# --- Physics ----------------------------------------------------------------

# Skip a ragdoll update until its bone table is ready, then retry next frame.
ragdoll_null_bone_guard = true

# Treat a ragdoll raycast against a detached physics body as "no hit" for that
# frame.
ragdoll_detached_phantom_guard = true

# Skip empty slots when adding physics entities. Valid entities still load.
# This also enables shared physics NULL protection.
havok_add_entity_batch_null_guard = true

# Skip empty slots in the pending physics add list. Valid objects still load.
# Shared NULL protection stays on while either this or the add-batch option is on.
havok_pending_add_null_guard = true

# Drop an invalid collision pair before physics dispatch. Valid collisions are
# unchanged.
havok_narrowphase_invalid_pair_guard = true

# Skip the AddedToWorld callback when physics supplies no entity.
havok_post_add_null_entity_guard = true

# Remove an unsafe second read during physics-agent removal. The required unlock
# is preserved.
havok_remove_agent_null_reread_guard = true

# --- Memory and background tasks -------------------------------------------

# Stop two out-of-memory paths from writing through a null pointer, and abort an
# incomplete texture conversion instead of crashing.
memset_null_dst_guard = true

# Keep actor location lists from freeing references they do not own, and contain
# corrupt entries while saving.
lowprocess_generic_locations_fix = true

# Prevent model loading from racing over shared model-processing state. Model
# output is unchanged.
model_postprocess_serialization_fix = true

# Reject dead or malformed background tasks before dispatch or release. Valid
# tasks are unchanged.
queued_task_lifetime_guard = true

# Reject an invalid texture-cache object before its callbacks are used. Valid
# textures are unchanged.
source_texture_cache_publication_guard = true

# Remove empty slots from a UI tile value list before lookup. Valid tile values
# are untouched.
tile_value_null_slot_guard = true

# =============================================================================
# NATIVE IO
# =============================================================================
[io]

# Use two loading workers while guarding shared game state. Keep on for faster
# loading; turn off only to isolate a loading-related conflict.
parallel_enabled = true

# =============================================================================
# LOD STREAMING
# =============================================================================
[lod]

# Improve distant terrain, object, and tree loading. Keep on.
enabled = true

# Request distant scenery slightly before it becomes visible. Reduces pop-in.
prefetch_enabled = true

# Stop stale lifetime counters from unloading distant scenery that is still
# needed.
handoff_fix_enabled = true

# Give visible distant loading priority over background prefetch work.
priority_boost_enabled = true

# Limit ordinary model attachment work at the game's loading deadline.
# Restart required.
attachment_budget_enabled = true

# Prefetch and retention multipliers, 1.0 to 2.0.
# Higher prefetch = load earlier and reduce pop-in.
# Higher retention = keep distant scenery longer and use more memory.
object_prefetch_multiplier = 1.35
object_retention_multiplier = 1.50
tree_prefetch_multiplier = 1.35
tree_retention_multiplier = 1.50

# Terrain uses smaller margins because it grows work and memory faster.
terrain_prefetch_multiplier = 1.10
terrain_retention_multiplier = 1.20

# =============================================================================
# PERFORMANCE
# =============================================================================
[performance]

# Faster random numbers. Ranges and game cases remain compatible; the exact
# sequence differs from vanilla.
rng = true

# Faster decompression for saves and archives. Content is unchanged.
zlib = true

# Finish post-load cleanup before the first playable frame.
post_load_reconciliation_prepass = true

# Visibility and lighting speedups. They remove repeated CPU work; the final
# image and visibility decisions are unchanged.
#
# Reuse repeated light math when sorting an object's lights.
light_property_score_reuse = true
# Search each scene-light list once instead of restarting from the beginning.
scene_light_sequential_scan = true
# Remove redundant setup in object-bounds visibility tests.
multibound_frustum_tests = true
# Remove redundant setup in compound and portal visibility bounds.
multibound_vertex_setup = true
# Reduce repeated bookkeeping in compound visibility loops.
multibound_loop_bookkeeping = true
# Combine room lookup and insertion into one search.
scene_root_admission = true
# Remove redundant index work when building object transforms.
inverse_world_index_setup = true

# Add invisible occluders to cells without authored visibility data, so hidden
# objects behind large solid buildings are rejected earlier.
occlusion_planes = true

# Shared budget and per-cell cap for generated occluders (1 to 256). Nearby
# cells share the same budget.
occlusion_planes_max_per_cell = 128

# 0 = player cell only. 1 or 2 = also reuse cached occluders from nearby loaded
# cells. Neighbors are cached, not regenerated every frame.
occlusion_planes_grid_radius = 0

# Generated-plane cache, relative to the game folder or absolute.
occlusion_planes_cache_path = "syringe/psycho_occlusion_planes.cache"

# Verbose occlusion-plane diagnostics. Off for normal play; requires debug_log.
occlusion_planes_debug_log = false

# =============================================================================
# DIAGNOSTICS
# =============================================================================
[diagnostics]

# Detailed log for bug reports. Keep on.
debug_log = true

# Open a separate Windows console with live log output. Off for normal play.
console = false

# High-resolution hitch timing. Adds overhead; enable only while testing.
# Requires debug_log.
hitch_profiling = false

# Record the last 256 queued-task events for crash research.
# Requires queued_task_lifetime_guard = true.
task_lifetime_trace = false

# Record LOD streaming events for troubleshooting.
lod_streaming_trace = false
