# Psycho engine fixes - occlusion plane override data
#
# Optional per-cell override for the `occlusion_planes` feature. The runtime
# collects planes from live cell geometry during gameplay by default
# (`occlusion_planes_runtime = true`); a cell listed in this file uses these
# hand-authored records instead. It never modifies plugins and never touches
# authored occluders or rooms.
#
# A plane uses the engine's authored XOCP representation:
#   position = [x, y, z]      world-space rectangle center
#   size     = [width, height] full rectangle width/height in game units
#   axis     = [x, y, z]      unit rotation axis (or all zero for identity)
#   angle    = radians        rotation angle about `axis`
#   priority = 0..255         higher survives the per-cell cap; default 255
#
# The rectangle spans local X/Z and the local +Y axis is its normal. Injected
# planes are one-sided: the camera-side test activates the rectangle only when
# the camera lies on the local +Y side. Aim +Y outward from the solid surface
# (the side the player normally views) and keep the rectangle no larger than
# that face. The native plane fields are half-extents; this file takes full
# width/height and the runtime halves them.
#
# `cells` is the only consumed table. It is empty by default; cells without an
# entry are handled by the runtime geometry collector.
#
# Example:
#
# [[cells]]
# kind = "exterior"
# worldspace = 0x0000003C
# grid = [-3, -12]
#
# [[cells.planes]]
# position = [1234.0, 5678.0, 9012.0]
# size = [512.0, 384.0]
# axis = [0.0, 1.0, 0.0]
# angle = 1.5707964
# priority = 255
#
# [[cells]]
# kind = "interior"
# cell = 0x0003C944
#
# [[cells.planes]]
# position = [0.0, 0.0, 0.0]
# size = [256.0, 256.0]

cells = []
